name: piecework
description: 本地计件统计与工票对照助手（离线优先，全部数据仅存本机）
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ── 状态管理 ───────────────────────────────────────────────
  flutter_riverpod: ">=2.5.1 <3.0.0"

  # ── 本地数据库（Isar 社区维护分支：兼容 AGP 8 / 新版 Flutter）──
  isar_community: ^3.4.1
  isar_community_flutter_libs: ^3.4.1

  # ── 相机（内置预览拍照，不使用 image_picker）─────────────────
  camera: ">=0.10.0 <0.13.0"

  # ── 路径 ──────────────────────────────────────────────────
  path_provider: ^2.1.4
  path: ^1.9.0

  # ── 图片压缩（发给 AI 前压缩为 JPEG，纯 Dart）────────────────
  image: ">=4.1.0 <5.0.0"

  # ── SVG 渲染（AI 绘图卡片）──────────────────────────────────
  flutter_svg: ">=2.0.9 <3.0.0"

  # ── 报表 PNG 存入系统相册 ───────────────────────────────────
  gal: ">=2.3.0 <4.0.0"

  # ── CSV 导出 ──────────────────────────────────────────────
  csv: ">=6.0.0 <9.0.0"

  # ── 备份打包（zip：数据库 JSON + 图片目录）───────────────────
  archive: ^3.6.1

  # ── 选取备份文件 / 选择导出保存位置 ──────────────────────────
  file_picker: ">=8.0.0 <14.0.0"

  # ── AI 接口调用（OpenAI 兼容 /chat/completions）──────────────
  http: ">=1.1.0 <2.0.0"

  # ── 时间格式化 ────────────────────────────────────────────
  intl: ">=0.19.0 <0.21.0"

  # ── 唯一文件名 ────────────────────────────────────────────
  uuid: ">=4.3.0 <5.0.0"
  pointycastle: ^4.0.0
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ">=3.0.0 <7.0.0"
  build_runner: ">=2.4.9 <3.0.0"
  isar_community_generator: ^3.4.1

flutter:
  uses-material-design: true

  # ── 轻量级 Linux 环境（proot + Alpine minirootfs）──────────────
  # 给 AI 的终端用：assets 里的东西第一次使用时解压到应用目录
  assets:
    - assets/linux/
